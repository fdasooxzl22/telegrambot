name: Build and Deploy Telegram Bot

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
        continue-on-error: true
      
      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/telegrambot
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}
      
      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Push Docker image
        if: success() && github.event_name == 'push'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
        continue-on-error: true
      
      # Add your deployment steps here
      # Examples:
      # - Deploy to cloud service (Google Cloud Run, AWS ECS, etc.)
      # - SSH to server and restart container
      # - Use webhooks to trigger deployment
      
      - name: Deployment notification
        if: success()
        run: |
          echo "✅ Build completed successfully!"
          echo "Image tags: ${{ steps.meta.outputs.tags }}"
          echo ""
          echo "To deploy manually:"
          echo "1. Docker: docker pull <your-image> && docker-compose up -d"
          echo "2. Cloud: Use your platform's redeploy button"
          echo "3. SSH: ssh user@server 'cd /path/to/bot && docker-compose pull && docker-compose up -d'"
